name: Windows

# A map maker's Windows machine: only Bun, no compiler, make or nix (wisp:docs/platforms.md).
on: [push, pull_request]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Remove compilers, make and nix from PATH
        run: |
          kept=()
          IFS=: read -ra entries <<< "$PATH"
          for entry in "${entries[@]}"; do
            for tool in gcc gcc.exe cc.exe make make.exe mingw32-make.exe nix; do
              [ -e "$entry/$tool" ] && continue 2
            done
            kept+=("$entry")
          done
          echo "PATH=$(IFS=:; cygpath -wp "${kept[*]}")" >> "$GITHUB_ENV"
      - run: "! command -v gcc && ! command -v make && ! command -v nix"
      - run: bun run check
      - run: bun test
      - run: bun scripts/battlecraft.ts headless
